<html>
<head>
<title>Slopkit Exploit For 11.50-13.52 by Reza A.P</title>
<link rel="shortcut icon" href="favicon.ico"></link>
<link rel="stylesheet" href="style.css">
<style>
body{background: linear-gradient(to bottom right, #011A27, #0B2430);color:white;font-size:28px;text-align:center;margin:0;overflow:hidden;}
.info{position:relative;top:39%;}
</style>
</head>
<body>
<!-- Message -->
<div id="msgs" class="info">Running Webkit Exploit, Please Wait ...</div>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 11.50 - 13.52";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cache.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "jb.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
</body>
</html>
